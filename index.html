<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MP3 Çalar" />
  <meta id="theme-color-meta" name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cpath d='M118 46l-46 13v55.5a15.5 15.5 0 1 1-10-14.5V48l56-16v69.5a15.5 15.5 0 1 1-10-14.5V46z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <title>Sesli Kütüphane — MP3 Çalar & Kesici</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .safe-top {
      padding-top: max(env(safe-area-inset-top, 0px), 12px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 18px);
    }

    /* Sleek custom range slider */
    input[type="range"].seek-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6366f1;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    input[type="range"].seek-slider:active::-webkit-slider-thumb {
      transform: scale(1.2);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.75; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex justify-center transition-colors duration-200">

  <!-- Main Native Audio Engine -->
  <audio id="audio-engine" preload="metadata" playsinline></audio>

  <!-- Hidden Mini Preview Audio Engine (used inside Split Modal) -->
  <audio id="preview-audio" preload="metadata" playsinline></audio>

  <!-- Hidden Multi-File Picker -->
  <input id="mp3-file-input" type="file" multiple accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" class="hidden" onchange="handleFilesSelected(event)" />

  <!-- Mobile App Shell -->
  <div class="w-full max-w-[480px] min-h-screen bg-slate-50 dark:bg-slate-900 sm:shadow-2xl flex flex-col relative overflow-x-hidden">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 pb-3 safe-top flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm font-extrabold text-slate-900 dark:text-white leading-tight truncate">Sesli Kütüphane</h1>
          <p id="storage-info" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 truncate">Yükleniyor...</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- Dark / Light Theme Toggle -->
        <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 dark:text-amber-300 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition" title="Koyu / Aydınlık Mod">
          <svg id="icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
          <svg id="icon-sun" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
        </button>

        <!-- Add MP3 Button -->
        <button onclick="document.getElementById('mp3-file-input').click()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>MP3 Ekle</span>
        </button>
      </div>
    </header>

    <!-- Active Player Card -->
    <section class="px-3.5 pt-3.5">
      <div class="rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 dark:from-slate-800 dark:via-indigo-950/90 dark:to-slate-900 text-white p-4 shadow-xl border border-indigo-500/20">
        <!-- Track Info & Top Pills -->
        <div class="flex items-start justify-between gap-2 mb-3">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5 mb-1">
              <span id="player-status-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
              <span id="player-status-text" class="text-[10px] font-bold uppercase tracking-wider text-indigo-300">Hazır</span>
              <span id="player-marker-badge" class="hidden px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-200 text-[10px] font-bold"></span>
            </div>
            <h2 id="player-title" class="text-sm font-extrabold text-white truncate">Parça Seçilmedi</h2>
            <p id="player-subtitle" class="text-[11px] text-slate-400 truncate mt-0.5">Kütüphaneden bir MP3 ekleyin veya seçin</p>
          </div>

          <!-- Sleep Timer Pill -->
          <button onclick="openSleepModal()" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-[11px] font-semibold text-indigo-200 flex items-center gap-1 shrink-0 active:scale-95 transition">
            <span>🌙</span>
            <span id="sleep-pill-text">Uyku</span>
          </button>
        </div>

        <!-- Seek Bar -->
        <div class="mb-3">
          <input id="seek-bar" type="range" min="0" max="100" value="0" step="0.1" disabled class="seek-slider bg-slate-700" />
          <div class="flex items-center justify-between text-[11px] font-semibold text-slate-300 mt-1.5 tabular-nums">
            <span id="time-elapsed">00:00</span>
            <span id="time-remaining">-00:00</span>
          </div>

        <!-- Main Playback Controls -->
        <div class="flex items-center justify-between gap-2 mb-3">
          <!-- Speed Button -->
          <button onclick="cyclePlaybackRate()" class="w-14 h-10 rounded-2xl bg-white/10 hover:bg-white/15 text-xs font-extrabold text-indigo-200 active:scale-95 transition" title="Oynatma hızı">
            <span id="speed-label">1x</span>

          <!-- -15s / Play-Pause / +15s -->
          <div class="flex items-center gap-3">
            <button onclick="skipSeconds(-15)" class="w-11 h-11 rounded-2xl bg-white/10 hover:bg-white/15 flex flex-col items-center justify-center active:scale-95 transition" title="15 saniye geri">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
              </svg>
              <span class="text-[9px] font-bold -mt-0.5">15</span>
            </button>

            <button onclick="togglePlayPause()" class="w-14 h-14 rounded-full bg-indigo-500 hover:bg-indigo-400 text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center active:scale-95 transition">
              <svg id="icon-play" class="w-7 h-7 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg id="icon-pause" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
              </svg>
            </button>

            <button onclick="skipSeconds(15)" class="w-11 h-11 rounded-2xl bg-white/10 hover:bg-white/15 flex flex-col items-center justify-center active:scale-95 transition" title="15 saniye ileri">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3" />
              </svg>
              <span class="text-[9px] font-bold -mt-0.5">15</span>
            </button>
          </div>

          <!-- Auto-Next Toggle -->
          <button id="btn-autonext" onclick="toggleAutoNext()" class="w-14 h-10 rounded-2xl bg-white/10 hover:bg-white/15 text-[10px] font-bold flex flex-col items-center justify-center leading-tight active:scale-95 transition" title="Bitince sonraki parçaya geç">
            <span>⏭️</span>
            <span id="autonext-text" class="text-[9px]">Sıralı</span>
          </button>
        </div>

        <!-- Quick Split Marker & Direct Split Row -->
        <div class="grid grid-cols-2 gap-2 pt-2.5 border-t border-white/10">
          <button onclick="dropMainMarker()" class="py-2 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-[11px] font-bold text-amber-200 flex items-center justify-center gap-1.5 active:scale-95 transition">
            <span>📍</span>
            <span>Kesim İşareti</span>
          </button>
          <button onclick="openSplitForCurrent()" class="py-2 px-3 rounded-xl bg-indigo-500/30 hover:bg-indigo-500/40 border border-indigo-400/30 text-[11px] font-bold text-white flex items-center justify-center gap-1.5 active:scale-95 transition">
            <span>✂️</span>

          </button>
